name: Java Assignment CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quarkus_test
          POSTGRES_PASSWORD: quarkus_test
          POSTGRES_DB: quarkus_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U quarkus_test -d quarkus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: java-assignment
        run: chmod +x mvnw

      - name: Run tests
        working-directory: java-assignment
        run: ./mvnw test
        env:
          JAVA_TOOL_OPTIONS: -Duser.timezone=UTC

      - name: Check coverage report
        working-directory: java-assignment
        run: |
          test -f target/jacoco-report/index.html
          echo "JaCoCo coverage report generated successfully."